[project]
name = "minibank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "redis>=7.4.0",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "PyJWT>=2.12.1",
    "bcrypt>=5.0.0",
    "aiokafka>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "testcontainers[postgres,redis,kafka]>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
